<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English: от нуля до ЕГЭ</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="English"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0d1a4d">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f1;--card:#ffffff;--ink:#15241c;--soft:#5d6f64;--acc:#43a52c;--acc2:#2e7d1c;--accink:#fff;--red:#d62839;--red2:#a51b2a;--gold:#ffb703;--gold2:#d48c00;--ok:#2fae4f;--ok2:#1e8238;--bad:#ef4565;--bad2:#c42a4b;--line:#e1eadc;--chip:#eef5ea;--lc:#43a52c;--lc2:#7acb4f;--sh:0 1px 2px rgba(21,36,28,.05),0 12px 30px -18px rgba(21,36,28,.28);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1612;--card:#13221c;--ink:#eef6f0;--soft:#9fb4a8;--acc:#5cc644;--acc2:#3a8f28;--line:#243a30;--chip:#1a2d25;--ok:#4fd36b;--ok2:#2a9a43;--bad:#ff6b88;--bad2:#c93b58;--sh:0 1px 2px rgba(0,0,0,.35),0 16px 34px -22px rgba(0,0,0,.9);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1612;--card:#13221c;--ink:#eef6f0;--soft:#9fb4a8;--acc:#5cc644;--acc2:#3a8f28;--line:#243a30;--chip:#1a2d25;--ok:#4fd36b;--ok2:#2a9a43;--bad:#ff6b88;--bad2:#c93b58;--sh:0 1px 2px rgba(0,0,0,.35),0 16px 34px -22px rgba(0,0,0,.9);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(700px 380px at 110% -80px,color-mix(in srgb,var(--acc) 13%,transparent),transparent 70%),radial-gradient(560px 320px at -25% 0,color-mix(in srgb,#e63946 8%,transparent),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:28px;margin:0;font-weight:900;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 6px;font-weight:900;letter-spacing:-.005em;line-height:1.3}
h2.ih{display:flex;align-items:center;gap:12px}
h2.ih .meta{font-weight:600;font-size:14px;letter-spacing:0;margin-top:2px}
.ptitle{font-size:30px;margin:6px 2px 4px;letter-spacing:-.02em}
.plead{color:var(--soft);font-weight:700;margin:0 2px 16px}
p{margin:8px 0}
.meta{color:var(--soft);font-size:14.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);counter-reset:o}
.card.lock{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ic{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;background:var(--chip);font-size:23px;line-height:1}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:16px;padding:13px 22px;font-weight:900;font-size:16px;letter-spacing:.01em;box-shadow:0 4px 0 var(--acc2);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--acc2)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 0 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok2)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{flex:none;width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-size:18px;font-weight:900;display:inline-grid;place-items:center;padding:0;color:var(--ink);transition:transform .08s}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.bar{height:12px;background:var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7ee0b5);border-radius:12px;transition:width .4s}
/* header inside screens */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;margin:-16px -16px 6px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .ttl{flex:1;min-width:0;font-weight:900;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top+.bar{margin:4px 0 14px}
/* lesson steps */
.kick{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,var(--card));padding:4px 11px;border-radius:999px;margin-bottom:10px}
.kick.re{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--card))}
.ex{display:flex;align-items:center;gap:8px;padding:9px;border-radius:16px;background:var(--chip);margin:8px 0}
.ex .iconbtn{width:38px;height:38px;border-radius:12px;font-size:16px}
.ext{flex:1;min-width:0;padding-left:4px}
.ext b{display:block;font-size:17px;line-height:1.3}
.ext span{display:block;color:var(--soft);font-size:14.5px;font-weight:600}
.q{font-size:23px;font-weight:800;line-height:1.35;margin:4px 0 18px}
.gap{display:inline-block;min-width:64px;border-bottom:3px dashed var(--acc);margin:0 4px}
.hint{display:inline-block;background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--acc);border-radius:10px;padding:2px 10px;font-weight:900;font-size:15px;margin-left:6px;vertical-align:middle}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:10px;font-size:18px;font-weight:700;box-shadow:0 3px 0 var(--line);transition:transform .08s,border-color .15s,opacity .2s}
.opt::before{counter-increment:o;content:counter(o);flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--soft);font-weight:900}
.opt.pic{justify-content:center;font-size:38px;padding:8px}
.opt.pic::before{display:none}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));box-shadow:0 3px 0 var(--ok);color:var(--ink)}
.opt.ok::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card));box-shadow:0 3px 0 var(--bad)}
.opt.no::before{content:"✕";background:var(--bad);border-color:var(--bad);color:#fff}
.opt.gone{opacity:.28;text-decoration:line-through}
.mask{font-family:ui-monospace,Consolas,monospace;font-size:18px;letter-spacing:.12em;background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:10px;word-break:break-word}
input[type=text],textarea{width:100%;font:inherit;font-size:19px;font-weight:700;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input[type=text]:focus,textarea:focus{border-color:var(--acc);outline:none}
textarea{min-height:220px;resize:vertical;font-size:16px;font-weight:600}
/* bottom feedback sheet */
#fb:not(:empty){position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -12px 30px -12px rgba(0,0,0,.25)}
#fb:not(:empty)>*{max-width:568px;margin-left:auto;margin-right:auto}
#fb .row .btn{width:100%;padding:15px}
@media (prefers-reduced-motion:no-preference){#fb:not(:empty){animation:up .22s ease-out}@keyframes up{from{transform:translateY(100%)}}}
.fb{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 16px;font-size:16px;border:0;background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ink)}
.fb b{color:var(--ok2);font-size:18px}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.fb.bad b{color:var(--bad)}
#fb .fb:not(.bad)+.row .btn{background:var(--ok);box-shadow:0 4px 0 var(--ok2)}
#fb .fb.bad+.row .btn{background:var(--bad);box-shadow:0 4px 0 var(--bad2)}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px}
.tab{flex:1;border:0;background:none;border-radius:12px;padding:9px;font-weight:800;color:var(--soft)}
.tab[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.cnt{font-weight:900}.cnt.ok{color:var(--ok)}.cnt.no{color:var(--bad)}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{color:var(--soft);font-weight:800}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
label{display:flex;gap:10px;align-items:center;margin:8px 0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
details summary{cursor:pointer;font-weight:800;color:var(--acc)}
/* hero */
body:not([data-tab="learn"]) .hero{display:none}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:30px 18px 16px 20px;margin-bottom:16px;background:radial-gradient(90% 80% at 100% 0%,rgba(214,40,57,.55) 0%,transparent 60%),radial-gradient(80% 80% at 0% 110%,#3fbf5a 0%,transparent 55%),linear-gradient(155deg,#0c3524,#135c37 55%,#1c7a45);box-shadow:0 22px 40px -26px #0c3524}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 18%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 72% 62%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 40%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 45% 45%,#fff6 50%,transparent 51%);pointer-events:none}
.hrow{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .hi{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.hero .hs{color:#d3f0dc;font-weight:700;font-size:15px}
.hcat{position:relative;flex:none;width:112px;margin:-6px -4px -8px 0}
.hcat .bub{position:absolute;top:-6px;right:72px;white-space:nowrap;background:#fff;color:#15241c;font-weight:900;font-size:12.5px;padding:4px 10px;border-radius:12px 12px 4px 12px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.goal{position:relative;margin-top:12px;font-weight:800;font-size:14.5px;color:#e4f6e9;display:flex;align-items:center;gap:10px}
.goal .bar{flex:1;margin:0;height:10px;background:rgba(255,255,255,.18)}
.goal .bar i{background:linear-gradient(90deg,var(--gold),#ffe08a)}
.ring{--p:0;flex:none;width:94px;height:94px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.16) 0);display:grid;place-items:center}
.ring>div{width:74px;height:74px;border-radius:50%;background:rgba(18,24,84,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:22px;font-weight:900}
.ring span{font-size:10.5px;color:#cdd5ff;font-weight:800;text-align:center}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 11px;font-weight:800;font-size:13.5px}
.goal-ok{position:relative;margin-top:10px;font-weight:800;color:#bff5dc;font-size:15px}
/* continue */
.cont{position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(135deg,var(--lc),var(--lc2));box-shadow:0 18px 34px -22px var(--lc)}
.cont::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.cont .meta{color:rgba(255,255,255,.88)}
.cont h2{font-size:23px;margin:2px 0}
.tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:800}
.cont .btn{position:relative;z-index:1;margin-top:14px;background:#fff;color:var(--lc);box-shadow:0 4px 0 rgba(0,0,0,.2)}
/* beginners */
.newbie{border:2px dashed color-mix(in srgb,var(--ok) 50%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--card))}
.nb-h{display:flex;gap:14px;align-items:center}
.nb-h .ic{width:56px;height:56px;font-size:32px;border-radius:18px;background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;font-size:13px;font-weight:700;line-height:1.3;text-align:center}
.steps b{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px}
.newbie .bar i{background:linear-gradient(90deg,var(--ok),#7ee0b5)}
.mini{display:flex;align-items:center;gap:14px}
.mini .tx{flex:1;min-width:0}
.mini h2{margin:0}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:900;margin-left:6px;vertical-align:2px}
/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 10px;overflow-x:hidden}
.lvh{width:100%;color:#fff;border-radius:22px;padding:14px 16px;margin:20px 0 12px;font-weight:900;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(135deg,var(--lc),var(--lc2));box-shadow:0 5px 0 color-mix(in srgb,var(--lc) 65%,#000)}
.lvh span{display:block;font-weight:700;font-size:13.5px;opacity:.9}
.lvh .sm{box-shadow:none;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)}
.lvh>b{font-size:15px;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 12px}
.pn{text-align:center;position:relative;width:160px}
.node{width:74px;height:70px;border-radius:50%;border:0;font-size:26px;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--lc2),var(--lc));box-shadow:0 7px 0 color-mix(in srgb,var(--lc) 65%,#000);transition:transform .1s}
.node.done{background:linear-gradient(160deg,#ffd34d,var(--gold));box-shadow:0 7px 0 var(--gold2)}
.node.cur{box-shadow:0 7px 0 color-mix(in srgb,var(--lc) 65%,#000),0 0 0 8px color-mix(in srgb,var(--lc) 24%,transparent)}
.node.lk{background:var(--line);color:var(--soft);box-shadow:0 7px 0 color-mix(in srgb,var(--line) 70%,#000 15%);font-size:20px;cursor:default}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.nl{font-size:13px;font-weight:800;margin-top:12px;color:var(--soft);line-height:1.25}
.nl .st{color:var(--gold);letter-spacing:2px;font-size:12px}
.go{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--lc);color:var(--lc);font-weight:900;font-size:12px;letter-spacing:.06em;padding:3px 12px;border-radius:10px;white-space:nowrap;z-index:1}
.go::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--card);border-right:2px solid var(--lc);border-bottom:2px solid var(--lc)}
@media (prefers-reduced-motion:no-preference){.go{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,-5px)}}.node.cur{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 7px 0 color-mix(in srgb,var(--lc) 65%,#000),0 0 0 14px color-mix(in srgb,var(--lc) 10%,transparent)}}.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}.tp,.top~.card{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}}}
/* level page */
.lsn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.lsn:last-child{border-bottom:0}
.lsn .num{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--lc2),var(--lc))}
.lsn .num.d{background:linear-gradient(160deg,#ffd34d,var(--gold))}
.lsn .lt{flex:1;font-weight:800;line-height:1.3}
.lsn small{display:block;color:var(--soft);font-weight:700;font-size:13px}
.lsn .arr{color:var(--soft);font-size:24px;font-weight:900}
/* lesson end */
.done-card{text-align:center;position:relative;overflow:hidden}
.done-card .boom{font-size:64px;line-height:1.1}
.mini h2{font-size:17.5px}
.stars{font-size:46px;letter-spacing:8px;color:var(--line);line-height:1.2}
.stars .on{color:var(--gold);text-shadow:0 3px 0 var(--gold2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.tiles div{background:var(--chip);border-radius:16px;padding:10px 4px;font-size:12.5px;font-weight:800;color:var(--soft)}
.tiles b{display:block;font-size:22px;color:var(--ink)}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){.burst i{animation:conf 1.8s ease-in forwards}@keyframes conf{0%{opacity:1}100%{transform:translateY(460px) rotate(600deg);opacity:0}}}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;width:min(560px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 14px 30px -16px rgba(0,0,0,.45)}
.tabbar button{flex:1;background:none;border:0;border-radius:18px;padding:6px 2px;font-size:11.5px;font-weight:800;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s}
.tabbar button span{font-size:22px;line-height:1.2;transition:transform .15s}
.tabbar button[aria-current="true"]{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.tabbar button[aria-current="true"] span{transform:scale(1.12)}
.inner .tabbar{display:none}
/* profile */
.prof{display:flex;gap:14px;align-items:center}
.ava{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:linear-gradient(160deg,#ffd34d,#ff8a5c)}
.prof .tx{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:12.5px;color:var(--soft);font-weight:700}
.stats>div{background:var(--chip);border-radius:16px;padding:12px 4px}
.stats b{display:block;font-size:24px;font-weight:900;color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:11.5px;font-weight:800}
.bdg{background:var(--chip);border-radius:16px;padding:10px 4px}
.bdg span{display:block;font-size:32px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.wk{display:flex;gap:8px;align-items:flex-end;height:150px}

.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 10px;font-weight:800;font-size:13.5px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tgl{flex:none;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}

[[0,["the: определённый артикль||The sun is hot.=Солнце жаркое.;Close the door, please.=Закрой дверь, пожалуйста.;I have a cat. The cat is black.=У меня есть кошка. Кошка чёрная.|<b>the</b> ставим, когда ясно, о каком предмете речь, или он единственный: the sun, the moon. Если предмет упоминается впервые — <b>a/an</b>.|I see ___ moon.~a^an^the^—~2~Луна одна — the moon.|I have a dog. ___ dog is big.~A^An^The^—~2~Собака уже упоминалась — the.",

"Предлоги времени: at, on, in||I get up at seven.=Я встаю в семь.;We have English on Monday.=У нас английский в понедельник.;My birthday is in July.=Мой день рождения в июле.|<b>at</b> — точное время (at 5 o’clock), <b>on</b> — дни (on Friday), <b>in</b> — месяцы, годы, части дня (in May, in 2020, in the morning).|The lesson starts ___ nine o’clock.~in^on^at^to~2~Точное время — at.|I was born ___ 2010.~in^on^at^by~0~Год — in.|We go to the cinema ___ Saturday.~in^at^on^by~2~День — on.",
"Как часто: always, usually, never||I always brush my teeth.=Я всегда чищу зубы.;She usually walks to school.=Она обычно ходит в школу пешком.;We never eat meat.=Мы никогда не едим мясо.|Слова <b>always, usually, often, sometimes, never</b> стоят перед глаголом, но после to be: She is always late.|He ___ late. (всегда)~is always^always is^always are^is alway~0~После to be: is always.|I ___ play tennis on Sunday. (иногда)~play sometimes^sometimes play^sometimes plays^plays sometimes~1~Перед глаголом: sometimes play.",

[1,["should: совет||You should drink more water.=Тебе стоит пить больше воды.;He shouldn’t eat so much.=Ему не стоит так много есть.;Should I call him?=Мне стоит ему позвонить?|<b>should</b> — совет («стоит, следует»). После should глагол без to и без -s. Отрицание: shouldn’t.|You ___ go to bed earlier.~should^should to^shoulds^are should~0~should + глагол без to.|She ___ eat so much sugar.~shouldn’t^doesn’t should^not should^shouldn’t to~0~Отрицание — shouldn’t.",
"will и going to||I think it will rain.=Думаю, будет дождь.;I will help you!=Я тебе помогу!;We are going to visit Rome.=Мы собираемся в Рим.|<b>will</b> — решение в момент речи, предсказание, обещание. <b>going to</b> — заранее принятый план.|I’ve bought tickets. We ___ fly to Spain.~will^are going to^going^go~1~Билеты уже куплены — план: are going to.|The phone is ringing. I ___ answer it!~am going to^will^go^answering~1~Решение сейчас — will.",
"much, many, a lot of||How many apples do you have?=Сколько у тебя яблок?;I don’t have much time.=У меня мало времени.;There are a lot of people here.=Здесь много людей.|<b>many</b> — с исчисляемыми (many books), <b>much</b> — с неисчисляемыми (much water), <b>a lot of</b> — с любыми в утверждениях.|How ___ money do you need?~many^much^few^a lot~1~money — неисчисляемое: much.|There aren’t ___ chairs.~much^many^a little^any much~1~chairs исчисляемое: many.",
"too и enough||It is too cold to swim.=Слишком холодно, чтобы плавать.;She is old enough to drive.=Она достаточно взрослая, чтобы водить.;The soup is too hot.=Суп слишком горячий.|<b>too</b> + прилагательное — «слишком» (плохо). Прилагательное + <b>enough</b> — «достаточно».|The bag is ___ heavy for me.~enough^too^very much^so much~1~Слишком тяжёлая — too heavy.|He is tall ___ to play basketball.~too^enough^much^very~1~tall enough — достаточно высокий.",
"Present Perfect и Past Simple||I have seen this film.=Я смотрела этот фильм.;I saw it yesterday.=Я смотрела его вчера.;Have you ever been to Italy?=Ты бывала в Италии?|Если есть метка прошлого (yesterday, in 2019, last week) — <b>Past Simple</b>. Если важен опыт или результат без точного времени — <b>Present Perfect</b>.|I ___ him yesterday.~have seen^saw^see^seen~1~yesterday — Past Simple: saw.|She ___ already finished.~has^have^did^is~0~already + has finished.",

[2,["Question tags||You like tea, don’t you?=Ты любишь чай, да?;She isn’t late, is she?=Она не опаздывает, да?;They can swim, can’t they?=Они умеют плавать, да?|В конце фразы просим подтвердить: после утверждения — <b>отрицательный</b> хвост, после отрицания — <b>положительный</b>.|It’s cold today, ___?~is it^isn’t it^does it^doesn’t it~1~Утверждение — отрицательный хвост: isn’t it?|You don’t know him, ___?~don’t you^do you^are you^aren’t you~1~Отрицание — положительный хвост: do you?",
"Phrasal verbs||Look for your keys.=Ищи свои ключи.;Please turn off the light.=Пожалуйста, выключи свет.;He gave up smoking.=Он бросил курить.|<b>Фразовые глаголы</b> = глагол + частица, значение часто новое: look for — искать, turn off — выключать, give up — бросать, find out — выяснить.|Can you ___ the music? It’s too loud. (выключить)~turn off^turn on^turn up^turn in~0~turn off — выключить.|I’m ___ my glasses. (ищу)~looking after^looking for^looking at^looking up~1~look for — искать.",
"Phrasal verbs: ещё|give up=бросать=🚫;find out=выяснить=🔎;turn on=включать=🔛;take off=снимать=👚;put on=надевать=🧣;look after=присматривать=🧸|Take off your shoes.=Сними обувь.;I look after my little sister.=Я присматриваю за младшей сестрой.",
"Linking words: although, however||Although it was cold, we went out.=Хотя было холодно, мы вышли.;It was cold. However, we went out.=Было холодно. Тем не менее мы вышли.;Despite the rain, we played.=Несмотря на дождь, мы играли.|<b>although</b> + целое предложение, <b>despite</b> + существительное или -ing, <b>however</b> — отдельное предложение, после него запятая.|___ the rain, we went for a walk.~Although^Despite^However^But~1~Despite + существительное.|___ he was tired, he finished the work.~Despite^Although^However^In spite~1~Although + предложение.",
"Present Perfect Continuous||I have been waiting for an hour.=Я жду уже час.;She has been studying since morning.=Она учится с утра.;How long have you been living here?=Как давно ты здесь живёшь?|<b>have/has been + глагол с -ing</b> — действие началось раньше и всё ещё идёт или только что закончилось. Часто с for и since.|I ___ English for three years.~have been learning^am learning^learned^was learning~0~for three years — have been learning.|It ___ since morning.~has been raining^is raining^rained^has rain~0~since morning — has been raining.",
"Артикли: a, the и без артикля||I like music.=Я люблю музыку.;She is a teacher.=Она учительница.;We went to the cinema.=Мы ходили в кино.|<b>Без артикля</b> — общие понятия и множественное число: I like dogs. <b>a</b> — один из многих, профессия. <b>the</b> — конкретный, известный предмет.|He wants to be ___ doctor.~a^an^the^—~0~Профессия — a doctor.|I love ___ chocolate.~a^the^—^an~2~Общее понятие — без артикля."]],
[3,["Conditionals 2 и 3||If I had more time, I would travel.=Если бы у меня было больше времени, я бы путешествовала.;If she had studied, she would have passed.=Если бы она училась, она бы сдала.;I would help you if I could.=Я бы тебе помогла, если бы могла.|<b>2-й тип</b>: If + Past Simple, would + глагол (нереально сейчас). <b>3-й тип</b>: If + Past Perfect, would have + V3 (нереально в прошлом).|If I ___ rich, I would buy a boat.~am^were^will be^would be~1~2-й тип: If I were.|If he had left earlier, he ___ the train.~would catch^would have caught^caught^will catch~1~3-й тип: would have + V3.",
"Past Perfect||When I arrived, the film had already started.=Когда я пришла, фильм уже начался.;She had finished before he called.=Она закончила до его звонка.;I hadn’t seen him for years.=Я не видела его много лет.|<b>had + V3</b> — действие раньше другого действия в прошлом. Часто: already, before, by the time.|By the time we arrived, the shop ___.~closed^had closed^has closed^was closing~1~Раньше другого прошлого — had closed.|She said she ___ the book before.~read^had read^has read^reads~1~Косвенная речь: had read.",
"wish и if only||I wish I had more free time.=Жаль, что у меня мало свободного времени.;I wish I could fly.=Хотела бы я уметь летать.;If only I had studied harder!=Если бы только я лучше училась!|<b>wish + Past Simple</b> — сожаление о настоящем. <b>wish + Past Perfect</b> — сожаление о прошлом. С wish для всех лиц: I wish I were…|I wish I ___ a car. (сейчас нет)~have^had^will have^would have~1~wish + Past Simple.|I wish I ___ to the party yesterday.~went^had gone^go^would go~1~Сожаление о прошлом — had gone.",
"Passive: все времена||The room is cleaned every day.=Комнату убирают каждый день.;The letter has been sent.=Письмо отправлено.;The house is being built.=Дом строится.|<b>be + V3</b>. Время показывает be: is cleaned, was cleaned, has been cleaned, will be cleaned, is being cleaned.|The new bridge ___ now.~is building^is being built^was built^builds~1~Сейчас идёт процесс: is being built.|The documents ___ yet.~haven’t been signed^aren’t signing^didn’t sign^hasn’t signed~0~yet — haven’t been signed.",
"Суффиксы существительных|happiness=счастье;kindness=доброта;information=информация;education=образование;invention=изобретение;friendship=дружба|Her kindness helped me.=Её доброта мне помогла.;Education is important.=Образование важно.|Суффиксы <b>-ness, -tion/-ation, -ship, -ment</b> делают существительные: happy → happiness, educate → education, friend → friendship, improve → improvement.|Her ___ made everyone smile. (HAPPY)~happy^happiness^happily^happier~1~Нужно существительное: happiness.|The ___ of the telephone changed the world. (INVENT)~invention^inventor^inventive^invented~0~Существительное: invention.",
